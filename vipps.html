
<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Du er hacket</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Vipps</h1>
        <p>Helt legit side</p>
    </header>

    <main>
        <h2>Bekreft kontoen din</h2>

        <p>
            Vi har 100% store kunder
            så vi vet hva vi snakker om!
        </p>

        <form action="bekreft.html" method="get">

            <label for="navn">Navn</label>
            <input
                type="text"
                id="navn"
                placeholder="Navn"
                required
            >

            <label for="nummer">Kundenummer</label>
            <input
                type="text"
                id="nummer"
                placeholder="Kundenummer"
                required
            >

            <label for="farge">Favorittfarge</label>
            <input
                type="text"
                id="farge"
                placeholder="Favorittfarge"
                required
            >

            <label for="balanse">Kontobalanse</label>
            <input
                type="text"
                id="balanse"
                placeholder="Kontobalanse"
                required
            >

            <button type="submit">
                Bekreft
            </button>

        </form>
    </main>

    <footer>
        <p>Vipps - Helt legit side</p>
    </footer>

</body>
</html>
